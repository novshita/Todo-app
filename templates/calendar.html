<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blush: #FFDBDA;
            --rose: #DB7F8E;
            --slate: #D5C5C8;
            --steel: #9DA3A4;
            --taupe: #604D53;
        }

        body {
            min-height: 100vh;
            position: relative;
            background-color: var(--blush);
            background-image: radial-gradient(rgba(219, 127, 142, 0.35) 1.6px, transparent 1.6px);
            background-size: 24px 24px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 40px 20px 90px;
        }

        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 46px;
            background: repeating-linear-gradient(90deg, #fff7f0 0 26px, var(--taupe) 26px 30px);
            box-shadow: 0 -2px 10px rgba(96, 77, 83, 0.25);
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 36px;
            width: 100%;
            max-width: 620px;
            box-shadow: 0 8px 32px rgba(96, 77, 83, 0.2);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--rose), var(--taupe));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--steel);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        /* ── Month nav ── */
        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .cal-header h2 {
            font-size: 1.2rem;
            color: var(--taupe);
        }

        a.nav-btn {
            background: #f7e4e6;
            color: var(--rose);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.1s;
        }

        a.nav-btn:hover {
            background: var(--rose);
            color: white;
            transform: scale(1.1);
        }

        /* ── Grid ── */
        .weekdays,
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .weekdays {
            margin-bottom: 8px;
        }

        .weekdays span {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--steel);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .days-grid {
            margin-bottom: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            border-radius: 12px;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--taupe);
            box-shadow: 0 2px 6px rgba(96, 77, 83, 0.1);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .day-cell:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(96, 77, 83, 0.18);
        }

        .day-cell.other-month {
            opacity: 0.35;
        }

        .day-cell.today {
            border: 2px solid var(--rose);
        }

        .day-number {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .day-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--rose), var(--taupe));
            margin-top: 4px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: var(--rose);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>
    <div class="card">
        <h1>My Calendar</h1>
        <p class="subtitle">Click a day to see its tasks</p>

        <div class="cal-header">
            <a class="nav-btn" href="/calendar?year={{ prev_year }}&month={{ prev_month }}" title="Previous month">‹</a>
            <h2>{{ month_name }} {{ year }}</h2>
            <a class="nav-btn" href="/calendar?year={{ next_year }}&month={{ next_month }}" title="Next month">›</a>
        </div>

        <div class="weekdays">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>

        {% for week in weeks %}
        <div class="days-grid">
            {% for d in week %}
            <a class="day-cell {% if not d.in_month %}other-month{% endif %} {% if d.is_today %}today{% endif %}"
                href="/?date={{ d.date }}">
                <span class="day-number">{{ d.day }}</span>
                {% if d.count > 0 %}<span class="day-dot" title="{{ d.count }} task(s)"></span>{% endif %}
            </a>
            {% endfor %}
        </div>
        {% endfor %}

        <a class="back-link" href="/">← Back to task list</a>
    </div>
</body>

</html>
